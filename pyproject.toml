[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minivllm"
version = "0.1.0"
description = "A minimal, readable re-implementation of PagedAttention and continuous batching, for learning"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4",
    "transformers>=4.56,<5",
    "accelerate>=0.33",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["minivllm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["B008"]
