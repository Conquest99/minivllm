[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minivllm"
version = "0.1.0"
description = "A minimal, readable re-implementation of PagedAttention and continuous batching, for learning"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4",
    "transformers>=4.56,<5",
    "accelerate>=0.33",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]
mysql = ["pymysql>=1.1"]
serve = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["minivllm*", "miniagent*", "serve*"]

[tool.setuptools.package-data]
serve = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"
# ruff also formats python fences inside Markdown, which reflows the deliberately
# column-aligned snippets in docs/. Keep the docs exactly as written.
# Test.py / prompt_Test.py are hand-written study notes (pseudo-code with Chinese
# comments and example call sites), not runnable Python -- they fail to parse or
# reference names that only exist in the reader's head, so linting them would fail
# the whole repo.
extend-exclude = ["docs", "miniagent/Test.py", "miniagent/prompt_Test.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["B008"]
